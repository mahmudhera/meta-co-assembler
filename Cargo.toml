[package]
name = "meta-co-assembler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An exploratory, resource-conscious metagenome coassembly pipeline"
repository = "https://github.com/mahmudhera/meta-co-assembler"
publish = false

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
csv = "1.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "fs"] }
