name: meta-co-assembler-env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Includes Cargo, rustfmt, and Clippy.
  - rust=1.99.1
  # Provides the native compiler/linker used by Rust.
  - c-compiler=2.0.0
  # Pilot preparation and selectable biological backends; no databases included.
  - python=3.13.18
  # QUAST 5.3.0 imports distutils, which Python 3.13 provides only through setuptools.
  - setuptools=84.2.1
  - sylph=1.0.0
  - kraken2=2.17.2
  - strobealign=0.20.0
  - minimap2=2.31
  - samtools=1.25
  - megahit=1.2.9
  - spades=4.3.0
  - art=2016.06.05
  - quast=5.3.0
